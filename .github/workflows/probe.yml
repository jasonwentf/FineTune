name: Runner probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Say hello
        run: |
          uname -a
          sw_vers 2>/dev/null || true
          xcodebuild -version 2>/dev/null || echo "no xcode"
